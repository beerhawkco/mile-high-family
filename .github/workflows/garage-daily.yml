name: Garage daily pulse

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run garage:pulse
      - name: Commit pulse
        run: |
          git config user.name "garage-pulse"
          git config user.email "garage-pulse@users.noreply.github.com"
          git add src/content/garage/store.json
          git diff --cached --quiet || git commit -m "Garage: daily market pulse"
          git push
